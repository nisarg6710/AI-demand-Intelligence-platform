services:
  - type: web
    name: ai-demand-intelligence-demo-api
    runtime: python
    plan: free
    rootDir: deployment/demo_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_DEMO_SNAPSHOT_DIR
        value: snapshot
    autoDeployTrigger: 'off'
